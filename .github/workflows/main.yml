name: Sehitlerimizi Guncelle

on:
  workflow_dispatch:
  schedule:
    # Her gece Türkiye saatiyle yaklaşık 03:00
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Tum kaynaklari cek ve birlestir
        run: |
          python merge_sources.py

      - name: iPhone ICS olustur
        run: |
          python - <<'PY'
          import csv
          import uuid
          from datetime import datetime, timedelta

          INPUT = "data/sehitlerimiz_takvim.csv"
          OUTPUT = "turkiye_sehitleri.ics"

          def esc(s):
              return (str(s or "")
                      .replace("\\", "\\\\")
                      .replace(";", "\\;")
                      .replace(",", "\\,")
                      .replace("\r", "")
                      .replace("\n", "\\n"))

          events = []

          with open(INPUT, encoding="utf-8-sig", newline="") as f:
              for row in csv.DictReader(f):
                  d = datetime.strptime(row["sehadet_tarihi"], "%Y-%m-%d").date()
                  name = row["ad_soyad"].strip() or "İsmi belirtilmemiş"
                  rank = row["rutbe"].strip()
                  title = f"Şehit {(rank + ' ') if rank else ''}{name}".strip()

                  desc = [
                      f"Şehadet tarihi: {d.strftime('%d.%m.%Y')}",
                      f"Şehadet yılı: {d.year}",
                  ]

                  for label, field in [
                      ("Kurum", "kurum"),
                      ("Baba adı", "baba_adi"),
                      ("Memleket", "memleket"),
                      ("Doğum yeri", "dogum_yeri"),
                      ("Doğum yılı", "dogum_yili"),
                      ("Dönem/Cephe", "donem_cephe"),
                      ("Kaynak", "kaynaklar"),
                  ]:
                      if row.get(field):
                          desc.append(f"{label}: {row[field]}")

                  uid_source = "|".join([
                      row.get("id",""), name, rank, row["sehadet_tarihi"]
                  ])
                  uid = str(uuid.uuid5(uuid.NAMESPACE_URL, uid_source)) + "@sehitlerimiz"

                  events += [
                      "BEGIN:VEVENT",
                      f"UID:{uid}",
                      f"DTSTAMP:{datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')}",
                      f"DTSTART;VALUE=DATE:{d.strftime('%Y%m%d')}",
                      f"DTEND;VALUE=DATE:{(d + timedelta(days=1)).strftime('%Y%m%d')}",
                      f"SUMMARY:{esc(title)}",
                      f"DESCRIPTION:{esc(chr(10).join(desc))}",
                      "CATEGORIES:Türkiye Şehitleri",
                      "RRULE:FREQ=YEARLY",
                      "STATUS:CONFIRMED",
                      "TRANSP:TRANSPARENT",
                      "END:VEVENT",
                  ]

          calendar = [
              "BEGIN:VCALENDAR",
              "VERSION:2.0",
              "PRODID:-//feyyazclskn//Sehitlerimiz//TR",
              "CALSCALE:GREGORIAN",
              "METHOD:PUBLISH",
              "X-WR-CALNAME:Türkiye Şehitleri",
              "X-WR-TIMEZONE:Europe/Istanbul",
          ]
          calendar.extend(events)
          calendar.append("END:VCALENDAR")

          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write("\r\n".join(calendar) + "\r\n")

          print("ICS etkinlik sayısı:", len([x for x in events if x == "BEGIN:VEVENT"]))
          PY

      - name: Degisiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ turkiye_sehitleri.ics

          git diff --cached --quiet || git commit -m "Tum kaynaklari birlestir ve takvimi guncelle"

          git push
