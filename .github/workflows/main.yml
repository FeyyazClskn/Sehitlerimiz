name: Sehitlerimizi Guncelle

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Tum kaynaklari cek
        run: |
          python merge_sources.py

      - name: iPhone ICS olustur
        run: |
          python - <<'PY'
          import csv
          import uuid
          from datetime import datetime, timedelta

          INPUT = "data/sehitlerimiz_takvim.csv"
          OUTPUT = "turkiye_sehitleri.ics"

          def esc(value):
              return (
                  str(value or "")
                  .replace("\\", "\\\\")
                  .replace(";", "\\;")
                  .replace(",", "\\,")
                  .replace("\r", "")
                  .replace("\n", "\\n")
              )

          events = []

          with open(
              INPUT,
              encoding="utf-8-sig",
              newline=""
          ) as f:

              reader = csv.DictReader(f)

              for row in reader:

                  date_value = row.get(
                      "sehadet_tarihi",
                      ""
                  ).strip()

                  if not date_value:
                      continue

                  try:
                      d = datetime.strptime(
                          date_value,
                          "%Y-%m-%d"
                      ).date()
                  except ValueError:
                      continue

                  name = (
                      row.get(
                          "ad_soyad",
                          ""
                      ).strip()
                      or "İsmi belirtilmemiş"
                  )

                  rank = (
                      row.get(
                          "rutbe",
                          ""
                      ).strip()
                  )

                  if rank:
                      title = (
                          f"Şehit {rank} {name}"
                      )
                  else:
                      title = (
                          f"Şehit {name}"
                      )

                  description = [
                      f"Şehadet tarihi: {d.strftime('%d.%m.%Y')}",
                      f"Şehadet yılı: {d.year}",
                  ]

                  fields = [
                      ("Kurum", "kurum"),
                      ("Baba adı", "baba_adi"),
                      ("Memleket", "memleket"),
                      ("Doğum yeri", "dogum_yeri"),
                      ("Doğum yılı", "dogum_yili"),
                      ("Dönem/Cephe", "donem_cephe"),
                      ("Kaynaklar", "kaynaklar"),
                  ]

                  for label, field in fields:

                      value = (
                          row.get(
                              field,
                              ""
                          ).strip()
                      )

                      if value:
                          description.append(
                              f"{label}: {value}"
                          )

                  uid_source = (
                      row.get("id", "")
                      + "|"
                      + name
                      + "|"
                      + date_value
                  )

                  uid = (
                      str(
                          uuid.uuid5(
                              uuid.NAMESPACE_URL,
                              uid_source
                          )
                      )
                      + "@sehitlerimiz"
                  )

                  end = d + timedelta(
                      days=1
                  )

                  events.extend([
                      "BEGIN:VEVENT",
                      f"UID:{uid}",
                      (
                          "DTSTAMP:"
                          + datetime.utcnow()
                          .strftime(
                              "%Y%m%dT%H%M%SZ"
                          )
                      ),
                      (
                          "DTSTART;VALUE=DATE:"
                          + d.strftime("%Y%m%d")
                      ),
                      (
                          "DTEND;VALUE=DATE:"
                          + end.strftime("%Y%m%d")
                      ),
                      f"SUMMARY:{esc(title)}",
                      (
                          "DESCRIPTION:"
                          + esc(
                              "\n".join(
                                  description
                              )
                          )
                      ),
                      "CATEGORIES:Türkiye Şehitleri",
                      "RRULE:FREQ=YEARLY",
                      "STATUS:CONFIRMED",
                      "TRANSP:TRANSPARENT",
                      "END:VEVENT",
                  ])

          calendar = [
              "BEGIN:VCALENDAR",
              "VERSION:2.0",
              "PRODID:-//feyyazclskn//Sehitlerimiz//TR",
              "CALSCALE:GREGORIAN",
              "METHOD:PUBLISH",
              "X-WR-CALNAME:Türkiye Şehitleri",
              "X-WR-TIMEZONE:Europe/Istanbul",
          ]

          calendar.extend(events)

          calendar.append(
              "END:VCALENDAR"
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "\r\n".join(calendar)
                  + "\r\n"
              )

          print(
              "ICS etkinlik sayısı:",
              events.count(
                  "BEGIN:VEVENT"
              )
          )

          PY

      - name: Degisiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ turkiye_sehitleri.ics

          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Tum kaynaklari birlestir ve takvimi guncelle"
            git push
          fi
